{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="container mt-5" style="max-width: 500px;">
    
    <div class="text-center mb-4">
        <h2>Welcome to MyBlog</h2>
        <p class="text-muted">Please enter your credentials to log in.</p>
    </div>

    <div class="card shadow-sm border-secondary text-start">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Login</h3>
            
            <form action="/login" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="identifier" name="identifier" required autocomplete="off">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="off">
                    <div class="text-end mt-1">
                        <!-- Permanent forgot password link for better UX -->
                        <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem;" class="text-decoration-none">Forgot Password?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            
            <div class="mt-3 text-center">
                <span class="text-muted" style="font-size: 0.9rem;">Don't have an account? </span>
                <a href="{{ url_for('signup') }}" class="text-decoration-none" style="font-size: 0.9rem;">Sign up here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
