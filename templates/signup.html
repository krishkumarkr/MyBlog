{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block body %}
<div class="container mt-5" style="max-width: 500px;">
    
    <div class="text-center mb-4">
        <h2>Welcome to MyBlog</h2>
        <p class="text-muted">Please fill in the form below to create an account.</p>
    </div>

    <div class="card shadow-sm border-secondary text-start">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Register</h3>

            <form action="/signup" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label for="reg_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="reg_name" name="reg_name" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="reg_username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="reg_username" name="reg_username" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="reg_email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="reg_email" name="reg_email" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="reg_password" class="form-label">Create Password</label>
                    <input type="password" class="form-control" id="reg_password" name="reg_password" required autocomplete="new-password">
                </div>

                <div class="mb-4">
                    <label for="reg_confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="reg_confirm_password" name="reg_confirm_password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>

            <div class="mt-3 text-center">
                <span class="text-muted" style="font-size: 0.9rem;">Already have an account? </span>
                <a href="{{ url_for('login') }}" class="text-decoration-none" style="font-size: 0.9rem;">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
