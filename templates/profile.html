{% extends "layout.html" %}

{% block title %}My Profile{% endblock %}

{% block body %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-lg border-dark p-4 text-start">
        <h3 class="mb-4 text-center">👤 Profile Details</h3>
        <ul class="list-group list-group-flush rounded border border-secondary">
            <li class="list-group-item bg-dark text-white py-3"><strong>Name:</strong> {{ user.name }}</li>
            <li class="list-group-item bg-dark text-white py-3"><strong>Username:</strong> {{ user.user_name }}</li>
            <li class="list-group-item bg-dark text-white py-3"><strong>Email:</strong> {{ user.email }}</li>
            
            <li class="list-group-item bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <span><strong>Blogs Uploaded:</strong></span>
                <a href="{{ url_for('my_blogs') }}" class="badge bg-info text-dark text-decoration-none rounded-pill px-3 py-2 fs-6">
                    {{ blog_count }}
                </a>
            </li>

            <li class="list-group-item bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <span><strong>Blogs Liked:</strong></span>
                <a href="{{ url_for('liked_blogs') }}" class="badge bg-danger text-white text-decoration-none rounded-pill px-3 py-2 fs-6">
                    {{ liked_count }}
                </a>
            </li>
        </ul>
    </div>
</div>
{% endblock %}
